# Render Blueprint: New > Blueprint, pick this repo, then fill in PAY_TO_SOLANA. The public URL is read from Render automatically.
services:
  - type: web
    name: foresyte
    runtime: node
    plan: starter # paid plan: no sleeping, so a paid scan never waits for a cold start
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NETWORK
        value: mainnet
      - key: SCAN_PRICE
        value: "$0.10"
      - key: PAY_TO_SOLANA
        sync: false # your Solana wallet that receives the $0.10 (must hold or have held USDC)
      - key: UPSTASH_REDIS_REST_URL
        sync: false # optional: free Upstash Redis so codes and the payment log survive restarts
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: PAY_TO_BASE
        sync: false # optional: your Base wallet, to also accept USDC on Base
