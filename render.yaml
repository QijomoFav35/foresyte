# Render Blueprint: New > Blueprint, pick this repo. Then fill in PUBLIC_URL and PAY_TO.
services:
  - type: web
    name: foresyte
    runtime: node
    plan: starter # paid plan: no sleeping, so a paid scan never waits for a cold start
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NETWORK
        value: mainnet
      - key: SCAN_PRICE
        value: "$0.25"
      - key: PUBLIC_URL
        sync: false # e.g. https://foresyte.onrender.com
      - key: PAY_TO_SOLANA
        sync: false # your Solana wallet that receives the $0.25 (must hold or have held USDC)
      - key: PAY_TO_BASE
        sync: false # optional: your Base wallet, to also accept USDC on Base
